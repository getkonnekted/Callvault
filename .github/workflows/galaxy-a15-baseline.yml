name: Galaxy A15 Baseline Build

on:
  push:
    branches:
      - feat/galaxy-a15-whatsapp-voip
    paths:
      - '**'
      - '.github/workflows/galaxy-a15-baseline.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: galaxy-a15-baseline-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-debug-apk:
    name: Compile debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-disabled: true

      - name: Ensure Gradle wrapper is executable
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: callvault-galaxy-a15-baseline-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
